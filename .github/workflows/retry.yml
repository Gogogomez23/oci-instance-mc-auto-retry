name: OCI Stack Apply Auto-Retry

on:
  schedule:
    # Runs every 12 minutes automatically
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows you to trigger manually from GitHub UI anytime

jobs:
  retry-oci-apply:
    runs-on: ubuntu-latest

    steps:
      - name: Set up OCI CLI
        uses: oracle-actions/setup-oci-cli@v1.3.2
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          region: ${{ secrets.OCI_REGION }}
          api_key: ${{ secrets.OCI_KEY_FILE }}

      - name: Check Stack Status & Trigger Apply Job
        run: |
          STACK_ID="${{ secrets.OCI_STACK_OCID }}"
          
          echo "Checking recent jobs for Stack: $STACK_ID..."
          
          # Get the status of the latest job
          LAST_JOB_STATE=$(oci resource-manager job list --stack-id $STACK_ID --limit 1 --query "data[0].\"lifecycle-state\"" --raw-output 2>/dev/null || echo "UNKNOWN")
          
          echo "Latest job status: $LAST_JOB_STATE"
          
          if [ "$LAST_JOB_STATE" == "SUCCEEDED" ]; then
            echo "Instance provisioning has already SUCCEEDED! Stopping workflow..."
            exit 0
          elif [ "$LAST_JOB_STATE" == "IN_PROGRESS" ] || [ "$LAST_JOB_STATE" == "ACCEPTED" ]; then
            echo "A job is currently running. Skipping this attempt."
            exit 0
          fi

          echo "Triggering new Terraform Apply job..."
          oci resource-manager job create-apply-job \
            --stack-id $STACK_ID \
            --execution-plan-strategy "AUTO_APPROVED" \
            --display-name "GitHub Auto-Retry Apply"
